name: CI

on:
  workflow_call:
    inputs:
      folder_path:
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      folder-name: ${{ steps.sanitize.outputs.folder_name }}
    steps:
      - name: Sanitize folder name
        id: sanitize
        run: |
          FOLDER_NAME=$(basename "${{ inputs.folder_path }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "folder_name=$FOLDER_NAME" >> "$GITHUB_OUTPUT"
  lint:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.4.0
          working-directory: .
          args: >
            --config .golangci.yaml
            --verbose
            --timeout=3m
            ./${{ needs.prepare.outputs.folder-name }}/...
  tests:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: go.sum
      - name: Run tests
        working-directory: .
        run: go test -tags="fts5" ./${{ needs.prepare.outputs.folder-name }}/... -timeout 10s -race -coverprofile=coverage.txt -covermode=atomic
      - name: Upload test coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ needs.prepare.outputs.folder-name }}-${{ github.run_number }}
          path: coverage.txt
          retention-days: 1
